services:
  # ==============================================================================
  # CƠ SỞ DỮ LIỆU POSTGRESQL
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_DB: ${DB_NAME:-hr_manager}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hr_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hr-network

  # ==============================================================================
  # ỨNG DỤNG QUẢN LÝ NHÂN SỰ (FULL-STACK: FRONTEND + BACKEND)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-manager-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-hr_manager}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-123456}@postgres:5432/${DB_NAME:-hr_manager}
    ports:
      - "${PORT:-5000}:5000"
    networks:
      - hr-network

# ==============================================================================
# LƯU TRỮ DỮ LIỆU BỀN VỮNG (PERSISTENT VOLUMES)
# ==============================================================================
volumes:
  postgres_data:
    name: hr_postgres_data

# ==============================================================================
# MẠNG NỘI BỘ NỐI CÁC CONTAINER
# ==============================================================================
networks:
  hr-network:
    name: hr-manager-network
